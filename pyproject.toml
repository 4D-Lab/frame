[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frame"
version = "0.2.0"
requires-python = ">=3.12"
authors = [{name = "Rafael Lopes", email = "rafael.lopes@uef.fi"}]
readme = "README.md"
description = ""
dependencies = ["torch==2.12.1",
                "torch-scatter==2.1.2",
                "captum==0.9.0",
                "joblib==1.5.3",
                "optuna==4.9.0",
                "pandas==3.0.3",
                "plotly==6.8.0",
                "rdkit==2026.3.3",
                "scikit-learn==1.9.0",
                "scipy==1.18.0",
                "svgutils==0.3.4",
                "torch-geometric==2.8.0",
                "torch-scatter==2.1.2+pt212cu132"]

[project.scripts]
frame_tune = "frame.tune:main"
frame_train = "frame.train:main"
frame_gen = "frame.generate:main"
frame_eval = "frame.evaluate:main"
frame_explain = "frame.explain:main"
frame_scaffold = "frame.scaffold_split:main"

[dependency-groups]
dev = ["bump-my-version==1.3.0",
       "flake8==7.3.0",
       "generate-changelog==0.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["frame"]

[tool.uv]
package = true
find-links = ["https://download.pytorch.org/whl/cu132"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torch-scatter = { index = "pyg-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pyg-cu132"
url = "https://data.pyg.org/whl/torch-2.12.1+cu132.html"
explicit = true
format = "flat"

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
